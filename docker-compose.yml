services:
  app:
    build: .
    env_file: .env
    environment:
      SEARXNG_URL: http://searxng:8080
      DATA_DIR: /app/storage
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      - searxng
    restart: unless-stopped

  # Métamoteur de recherche auto-hébergé : interrogé uniquement par l'app, non exposé.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-changez-moi}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  storage:
